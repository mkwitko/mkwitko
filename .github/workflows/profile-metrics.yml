name: GitHub profile metrics (optional)
on:
  workflow_dispatch:
  schedule:
    - cron: "41 8 * * 1"
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Render metrics when explicitly configured
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mkwitko
          template: classic
          base: header, repositories
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          filename: assets/github-metrics.svg
          config_timezone: America/Sao_Paulo
          committer_branch: main
          committer_message: "chore: refresh GitHub metrics [skip ci]"
      - name: Explain missing configuration
        if: env.METRICS_TOKEN == ''
        run: echo "Metrics disabled. Configure a least-privilege METRICS_TOKEN repository secret to enable rendering."
